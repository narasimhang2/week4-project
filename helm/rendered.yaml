---
# Source: todo-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: todo-app-helm
  labels:
    helm.sh/chart: todo-app-0.1.0
    app.kubernetes.io/name: todo-app-helm
    app.kubernetes.io/instance: todo-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: todo-app-helm
    app.kubernetes.io/instance: todo-app

---
# Source: todo-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-helm
  labels:
    helm.sh/chart: todo-app-0.1.0
    app.kubernetes.io/name: todo-app-helm
    app.kubernetes.io/instance: todo-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-app-helm
      app.kubernetes.io/instance: todo-app
  template:
    metadata:
      labels:
        helm.sh/chart: todo-app-0.1.0
        app.kubernetes.io/name: todo-app-helm
        app.kubernetes.io/instance: todo-app
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: todo-app-sa
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: todo-app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          image: "todo-app:local"
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: todo-app-config
                  key: APP_ENV
            - name: APP_DEMO_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-app-secret
                  key: APP_DEMO_SECRET
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: /data
              name: todo-app-storage
      volumes:
        - name: todo-app-storage
          persistentVolumeClaim:
            claimName: todo-app-pvc
---
# Source: todo-app/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "todo-app-helm-test-connection"
  labels:
    helm.sh/chart: todo-app-0.1.0
    app.kubernetes.io/name: todo-app-helm
    app.kubernetes.io/instance: todo-app
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['todo-app-helm:5000']
  restartPolicy: Never

