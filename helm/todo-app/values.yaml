
replicaCount: 3

image:
  repository: todo-app
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: todo-app-helm
fullnameOverride: todo-app-helm

serviceAccount:
  create: false
  automount: false
  name: todo-app-sa

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: false

httpRoute:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false

volumes:
  - name: todo-app-storage
    persistentVolumeClaim:
      claimName: todo-app-helm-pvc

volumeMounts:
  - name: todo-app-storage
    mountPath: /data

nodeSelector: {}
tolerations: []
affinity: {}
